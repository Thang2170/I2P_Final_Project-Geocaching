<!DOCTYPE html>
<html lang="en">
<head>
  {% include "_head.html" %}
  <title>Hunts · StepQuest</title>
  <style>
    .hunt { display: flex; align-items: center; justify-content: space-between; gap: 16px;
            padding: 16px 0; border-top: 2px dashed var(--line); }
    .hunt__name { font-size: 24px; margin: 0; }
    .hunt__text { margin: 4px 0 0; }
    .hunt .btn { width: auto; margin: 0 4px 0 0; padding: 12px; font-size: 10px; white-space: nowrap; }
    .hunt .btn[disabled] { opacity: .5; }
    .hunt__buttons { display: flex; flex-direction: column; gap: 8px; }
    .hunt__buttons .btn { margin: 0; text-align: center; text-decoration: none; }
    .btn--chat { background: var(--px-gold); color: var(--px-ink); }
    .hunt__chat-later { max-width: 9em; font-size: 16px; text-align: center; }
    .unread-badge { display: inline-block; min-width: 1.6em; margin-left: 4px; padding: 3px 5px;
                    background: var(--px-bad); color: var(--px-paper); font-size: 10px; line-height: 1.4;
                    box-shadow: inset -2px -2px 0 0 rgba(0, 0, 0, .3); }
    #message .btn--chat { display: inline-block; width: auto; margin: 8px 0 0; padding: 12px;
                          font-size: 10px; text-decoration: none; }
    details { margin-top: 20px; }

    /* A: hunts as lobby cards: a status chip, seats drawn as blocks, one clear main button */
    .hunts-card { max-width: 720px; }
    #hunts { display: grid; gap: 16px; margin-top: 16px; }
    .hunt { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 16px;
            border-top: 0; background: var(--px-paper); box-shadow: inset 0 0 0 4px var(--px-line); }
    .hunt.is-racing { box-shadow: inset 0 0 0 4px var(--px-gold); }
    .hunt__head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
    .hunt__name { display: flex; align-items: center; gap: 8px; }
    .hunt__chip { padding: 2px 8px; background: var(--px-bg); box-shadow: inset 0 0 0 2px var(--px-line);
                  color: var(--px-muted); font-size: 16px; }
    .hunt__chip--racing { background: var(--px-gold); box-shadow: none; color: var(--px-ink);
                          animation: px-blink 1s steps(1) infinite; }
    .hunt__chip--finished { background: var(--px-green); box-shadow: none; color: var(--px-paper); }
    /* Seats: one block per place. Gold = joined, green = joined and online now. */
    .seats { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
    .seats i { width: 14px; height: 14px; box-shadow: inset 0 0 0 2px var(--px-line); }
    .seats i.is-taken { background: var(--px-gold); box-shadow: inset 0 0 0 2px var(--px-gold-dark); }
    .seats i.is-online { background: var(--px-grass-light); box-shadow: inset 0 0 0 2px var(--px-good); }
    .seats small { margin-left: 8px; color: var(--px-muted); font-size: 18px; }
    .hunt__text { margin: 0; }
    .hunt__goes { display: flex; align-items: center; gap: 8px; }
    .hunt__goes .px-icon { color: var(--px-green); }
    .hunt__buttons { flex-direction: row; flex-wrap: wrap; align-items: center; }
    .hunt .btn { margin: 0; }
    .hunt .btn--chat { background: var(--px-paper); box-shadow: var(--px-edge); }  /* secondary, not a second gold button */
    .hunt .hunt__leave { margin-left: auto; padding: 8px; background: none; box-shadow: none; color: var(--px-muted);
                         font-family: var(--font-body); font-size: 18px; text-decoration: underline; }
    .hunt .hunt__chat-later { max-width: none; text-align: left; }
    @media (prefers-reduced-motion: reduce) { .hunt__chip--racing { animation: none; } }
  </style>
</head>
<body>
  {% set active = "hunts" %}
  {% include "_topbar.html" %}

  <main class="card hunts-card">
    <h1>Hunts</h1>
    <p class="muted">Join a hunt to explore with others. When a hunt is full, you wait in line and move up as players leave.</p>

    <div id="hunts"></div>
    <p id="noHunts" class="muted" hidden>No hunts yet. Create the first one below.</p>

    <p id="message" class="message" role="status"></p>

    <details>
      <summary>Create a hunt</summary>
      <form id="createForm">
        <label for="name">Name</label>
        <input id="name" name="name" maxlength="60" required>
        <label for="description">Description</label>
        <input id="description" name="description" maxlength="200">
        <label for="capacity">Players at once (1 to 50, default 10)</label>
        <input id="capacity" name="capacity" inputmode="numeric" placeholder="10">
        <!-- A: where the race goes. Filled from /api/treasures below. -->
        <label for="treasure">Where the hunt goes</label>
        <select id="treasure" name="treasure_id"></select>
        <button type="submit" class="btn">Create hunt</button>
      </form>
    </details>
  </main>

  <script>
    // The browser only shows things and sends what you tap. Python decides who is playing and who waits.
    // textContent (not innerHTML) is used everywhere, so nothing from the server can inject HTML.
    const LOGIN_URL = "/login?next=/hunts";
    const message = document.getElementById("message");

    function show(text, ok) {
      message.textContent = text;
      message.className = "message " + (ok ? "ok" : "bad");
    }

    function el(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    function myStatus(me) {
      return me ? me.text : "";  // B: Python writes it (queue_logic.status_text)
    }

    function render(hunts) {
      const box = document.getElementById("hunts");
      box.replaceChildren();
      document.getElementById("noHunts").hidden = hunts.length > 0;
      for (const hunt of hunts) {
        const game = hunt.game || {};
        const row = el("div", undefined, "hunt" + (game.state === "started" ? " is-racing" : ""));
        const info = el("div");
        info.style.display = "contents";
        // A: "joined" = has a place (kept until Leave); "online now" = had the map open in the last 2 minutes
        const counts = `${hunt.playing}/${hunt.capacity} joined` + (hunt.waiting ? ` · ${hunt.waiting} waiting` : "")
          + ` · ${hunt.online} online now`;
        // A: a pixel flag before each hunt's name
        const name = el("p", undefined, "hunt__name");
        name.append(el("span", undefined, "sprite sprite--flag hunt__flag"), hunt.name);
        // A: the status as a chip next to the name
        const chip = game.state === "started" ? ["Racing", "hunt__chip hunt__chip--racing"]
          : game.state === "finished" ? ["Finished", "hunt__chip hunt__chip--finished"] : ["Open", "hunt__chip"];
        const head = el("div", undefined, "hunt__head");
        head.append(name, el("span", chip[0], chip[1]));
        info.append(head, seats(hunt, counts));
        if (hunt.description) info.append(el("p", hunt.description, "muted hunt__text"));
        // A: the race. Python decides the state, the winner and who may press Start.
        if (game.treasure) {
          const goes = el("p", undefined, "muted hunt__text hunt__goes");
          goes.append(el("span", undefined, "px-icon px-icon--map px-icon--sm"), `Goes to ${game.treasure.name}`);
          info.append(goes);
        }
        const race = el("p", undefined, "hunt__text");
        if (game.state === "finished") race.append(el("span", undefined, "sprite sprite--trophy hunt__trophy"));
        race.append(raceText(game));
        if (game.state === "started" || game.state === "finished") info.append(race);  // A: "Open" is in the chip
        if (hunt.me) info.append(el("p", myStatus(hunt.me), "hunt__text"));

        const buttons = el("div", undefined, "hunt__buttons");
        // Once you are playing in a hunt, its group chat is one tap away.
        // In line, the chat stays closed until you move up (Python decides; see hunt_chat.py).
        if (hunt.me && hunt.me.state === "playing") buttons.append(chatLink(hunt));
        else if (hunt.me) buttons.append(el("span", "Chat opens when you play", "muted hunt__chat-later"));
        // A: Start (only when Python says you may), then "Go to the hunt" for everyone playing
        if (game.can_start) buttons.append(startButton(hunt));
        if (game.state === "started" && hunt.me && hunt.me.state === "playing" && game.treasure) {
          const go = el("a", "Go to the hunt", "btn");
          go.href = `/?hunt=${Number(hunt.id)}&treasure=${Number(game.treasure.id)}`;
          buttons.append(go);
        }
        // B: a finished race can be watched again by the players who were in it (the server checks)
        if (game.state === "finished" && hunt.me) {
          const replay = el("a", "Watch replay", "btn btn--ghost");
          replay.href = `/hunts/${Number(hunt.id)}/replay`;
          buttons.append(replay);
        }
        // Once a race has started nobody new can join it (leaving is still fine)
        if (hunt.me || game.state === "open" || !game.state) {
          const button = el("button", hunt.me ? "Leave" : "Join", hunt.me ? "btn hunt__leave" : "btn");
          button.type = "button";
          button.addEventListener("click", () => act(hunt, button));
          buttons.append(button);
        }
        row.append(info, buttons);
        box.append(row);
      }
    }

    // A: one block per place in the hunt (up to 12, then "+N"); gold = joined, green = online now
    function seats(hunt, counts) {
      const box = el("div", undefined, "seats");
      box.setAttribute("role", "img");
      box.setAttribute("aria-label", counts);
      const shown = Math.min(hunt.capacity, 12);
      for (let i = 0; i < shown; i++) {
        box.append(el("i", undefined, i < hunt.online ? "is-taken is-online" : i < hunt.playing ? "is-taken" : ""));
      }
      if (hunt.capacity > shown) box.append(el("small", `+${hunt.capacity - shown}`));
      box.append(el("small", counts));
      return box;
    }

    // A: one line about the race
    function raceText(game) {
      if (game.state === "finished") return `Finished · winner: ${game.winner}`;
      if (game.state === "started") return "Racing now: the first to reach the treasure wins +20 coins";
      return "Not started yet";
    }

    function startButton(hunt) {
      const button = el("button", "Start", "btn");
      button.type = "button";
      button.addEventListener("click", async () => {
        if (button.disabled) return;
        button.disabled = true;
        try {
          const data = await post(`/api/hunts/${hunt.id}/start`);
          show(`"${data.name}" has started! Tap "Go to the hunt" and race to ${data.treasure.name}.`, true);
        } catch (error) {
          show(error.message, false);
        }
        await load();
      });
      return button;
    }

    // A: fill the "Where the hunt goes" list with every treasure
    async function loadTreasureChoices() {
      try {
        const res = await fetch("/api/treasures");
        const list = await res.json();
        const select = document.getElementById("treasure");
        for (const t of list) {
          const option = el("option", t.name);
          option.value = t.id;
          select.append(option);
        }
      } catch (error) {
        console.error("Treasure list failed:", error);
      }
    }
    loadTreasureChoices();

    function chatLink(hunt) {
      const link = el("a", "Open group chat", "btn btn--chat");
      link.href = `/hunts/${Number(hunt.id)}/chat`;
      // Messages you haven't read yet (Python counts them; your own never count)
      const unread = Number(hunt.unread) || 0;
      if (unread > 0) {
        link.append(" ", el("span", unread > 99 ? "99+" : String(unread), "unread-badge"));
        link.setAttribute("aria-label", `Open group chat, ${unread} unread`);
      }
      return link;
    }

    async function load() {
      const res = await fetch("/api/hunts");
      render(await res.json());
    }

    async function post(url, body) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body || {})
      });
      if (res.status === 401) { location.href = LOGIN_URL; throw new Error("Log in first"); }
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Something went wrong.");
      return data;
    }

    async function act(hunt, button) {
      if (button.disabled) return;  // a double tap must not send twice
      button.disabled = true;
      try {
        const data = await post(`/api/hunts/${hunt.id}/${hunt.me ? "leave" : "join"}`);
        if (data.me) {
          // Joined: say so, and offer the group chat right there in the message too.
          if (data.me.state === "playing") {
            show(`Joined "${data.name}". ${myStatus(data.me)}. `, true);
            message.append(chatLink(data));
          } else {
            show(`Joined "${data.name}". ${myStatus(data.me)}. The group chat opens when you move up.`, true);
          }
        } else {
          show(`Left "${data.name}".`, true);
        }
      } catch (error) {
        show(error.message, false);
      }
      await load();
    }

    document.getElementById("createForm").addEventListener("submit", async event => {
      event.preventDefault();
      try {
        const data = await post("/api/hunts", Object.fromEntries(new FormData(event.target)));
        event.target.reset();
        show(`Created "${data.name}". You are the first player.`, true);
        await load();
      } catch (error) {
        show(error.message, false);
      }
    });

    load().catch(error => console.error(error));
    // Refresh every 15 s (not while the tab is hidden), so new chat messages and places show up.
    setInterval(() => { if (!document.hidden) load().catch(error => console.error(error)); }, 15000);
  </script>
</body>
</html>
