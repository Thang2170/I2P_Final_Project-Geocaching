<!DOCTYPE html>
<html lang="en">
<head>
  {% include "_head.html" %}
  <title>Hunts · StepQuest</title>
  <style>
    .hunt { display: flex; align-items: center; justify-content: space-between; gap: 16px;
            padding: 16px 0; border-top: 2px dashed var(--line); }
    .hunt__name { font-size: 24px; margin: 0; }
    .hunt__text { margin: 4px 0 0; }
    .hunt .btn { width: auto; margin: 0 4px 0 0; padding: 12px; font-size: 10px; white-space: nowrap; }
    .hunt .btn[disabled] { opacity: .5; }
    .hunt__buttons { display: flex; flex-direction: column; gap: 8px; }
    .hunt__buttons .btn { margin: 0; text-align: center; text-decoration: none; }
    .btn--chat { background: var(--px-gold); color: var(--px-ink); }
    .hunt__chat-later { max-width: 9em; font-size: 16px; text-align: center; }
    #message .btn--chat { display: inline-block; width: auto; margin: 8px 0 0; padding: 12px;
                          font-size: 10px; text-decoration: none; }
    details { margin-top: 20px; }
  </style>
</head>
<body>
  {% set active = "hunts" %}
  {% include "_topbar.html" %}

  <main class="card">
    <h1>Hunts</h1>
    <p class="muted">Join a hunt to explore with others. When a hunt is full, you wait in line and move up as players leave.</p>

    <div id="hunts"></div>
    <p id="noHunts" class="muted" hidden>No hunts yet. Create the first one below.</p>

    <p id="message" class="message" role="status"></p>

    <details>
      <summary>Create a hunt</summary>
      <form id="createForm">
        <label for="name">Name</label>
        <input id="name" name="name" maxlength="60" required>
        <label for="description">Description</label>
        <input id="description" name="description" maxlength="200">
        <label for="capacity">Players at once (1 to 50, default 10)</label>
        <input id="capacity" name="capacity" inputmode="numeric" placeholder="10">
        <button type="submit" class="btn">Create hunt</button>
      </form>
    </details>
  </main>

  <script>
    // The browser only shows things and sends what you tap. Python decides who is playing and who waits.
    // textContent (not innerHTML) is used everywhere, so nothing from the server can inject HTML.
    const LOGIN_URL = "/login?next=/hunts";
    const message = document.getElementById("message");

    function show(text, ok) {
      message.textContent = text;
      message.className = "message " + (ok ? "ok" : "bad");
    }

    function el(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    function myStatus(me) {
      if (!me) return "";
      return me.state === "playing" ? `You are playing (#${me.position})` : `You are waiting: #${me.position} in line`;
    }

    function render(hunts) {
      const box = document.getElementById("hunts");
      box.replaceChildren();
      document.getElementById("noHunts").hidden = hunts.length > 0;
      for (const hunt of hunts) {
        const row = el("div", undefined, "hunt");
        const info = el("div");
        const counts = `${hunt.playing}/${hunt.capacity} playing` + (hunt.waiting ? ` · ${hunt.waiting} waiting` : "");
        info.append(el("p", hunt.name, "hunt__name"), el("p", counts, "muted hunt__text"));
        if (hunt.description) info.append(el("p", hunt.description, "muted hunt__text"));
        if (hunt.me) info.append(el("p", myStatus(hunt.me), "hunt__text"));

        const buttons = el("div", undefined, "hunt__buttons");
        // Once you are playing in a hunt, its group chat is one tap away.
        // In line, the chat stays closed until you move up (Python decides; see hunt_chat.py).
        if (hunt.me && hunt.me.state === "playing") buttons.append(chatLink(hunt));
        else if (hunt.me) buttons.append(el("span", "Chat opens when you play", "muted hunt__chat-later"));
        const button = el("button", hunt.me ? "Leave" : "Join", hunt.me ? "btn btn--ghost" : "btn");
        button.type = "button";
        button.addEventListener("click", () => act(hunt, button));
        buttons.append(button);
        row.append(info, buttons);
        box.append(row);
      }
    }

    function chatLink(hunt) {
      const link = el("a", "Open group chat", "btn btn--chat");
      link.href = `/hunts/${Number(hunt.id)}/chat`;
      return link;
    }

    async function load() {
      const res = await fetch("/api/hunts");
      render(await res.json());
    }

    async function post(url, body) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body || {})
      });
      if (res.status === 401) { location.href = LOGIN_URL; throw new Error("Log in first"); }
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Something went wrong.");
      return data;
    }

    async function act(hunt, button) {
      if (button.disabled) return;  // a double tap must not send twice
      button.disabled = true;
      try {
        const data = await post(`/api/hunts/${hunt.id}/${hunt.me ? "leave" : "join"}`);
        if (data.me) {
          // Joined: say so, and offer the group chat right there in the message too.
          if (data.me.state === "playing") {
            show(`Joined "${data.name}". ${myStatus(data.me)}. `, true);
            message.append(chatLink(data));
          } else {
            show(`Joined "${data.name}". ${myStatus(data.me)}. The group chat opens when you move up.`, true);
          }
        } else {
          show(`Left "${data.name}".`, true);
        }
      } catch (error) {
        show(error.message, false);
      }
      await load();
    }

    document.getElementById("createForm").addEventListener("submit", async event => {
      event.preventDefault();
      try {
        const data = await post("/api/hunts", Object.fromEntries(new FormData(event.target)));
        event.target.reset();
        show(`Created "${data.name}". You are the first player.`, true);
        await load();
      } catch (error) {
        show(error.message, false);
      }
    });

    load().catch(error => console.error(error));
  </script>
</body>
</html>
