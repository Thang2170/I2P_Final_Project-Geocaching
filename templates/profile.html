<!DOCTYPE html>
<html lang="en">
<head>
  {% include "_head.html" %}
  <title>{{ username }} · StepQuest</title>
</head>
<body>
  {% set active = "" %}
  {% include "_topbar.html" %}

  <main class="profile">
    <a href="javascript:history.back()" class="profile__back">◂ Back</a>

    {% include "_profile_view.html" %}
  </main>

  <main id="missing" class="card" hidden>
    <h1>No such player</h1>
    <p class="muted">Nobody here goes by that name.</p>
    <a class="btn" href="/community">Back to Community</a>
  </main>

  <script>
    const USERNAME = {{ username | tojson }};
    loadProfile(USERNAME).then(p => {
      if (p === null) {  // no such player
        document.querySelector(".profile").hidden = true;
        document.getElementById("missing").hidden = false;
      }
    }).catch(error => console.error(error));
  </script>
</body>
</html>
