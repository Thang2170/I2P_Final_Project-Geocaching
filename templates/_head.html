{# Shared <head> lines: phone-friendly viewport, the pixel fonts, pixel.css and app.css. #}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17332d">  {# phone browser bar matches the top bar #}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
{# Press Start 2P for headings and buttons, VT323 for reading text #}
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='css/pixel.css') }}">
{# A: the bigger sprites, made by pixel_art.py (python pixel_art.py) #}
<link rel="stylesheet" href="{{ url_for('static', filename='css/sprites.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
{# A: every <select> gets the pixel dropdown look (static/js/fancy_select.js); the real one stays for the form #}
<script src="{{ url_for('static', filename='js/fancy_select.js') }}" defer></script>
{# B: install StepQuest like an app (pwa_api.py): the manifest, the icon, and the service worker #}
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icons/icon-192.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="StepQuest">
<script src="{{ url_for('static', filename='js/install.js') }}" defer></script>
