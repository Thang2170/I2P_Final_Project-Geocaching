{# Shared top bar. A page picks its highlighted link with: {% set active = "map" %}
   Plain paths (not url_for) because test apps only register some blueprints. #}
<header class="topbar">
  <a class="brand" href="/welcome">
    <span class="brand__mark sprite sprite--coin" aria-hidden="true"></span>
    <span class="brand__name">Treasure Hunt Club</span>
  </a>
  <nav class="topbar__nav">
    <a href="/" class="{{ 'is-active' if active == 'map' }}">Map</a>
    <a href="/upload" class="{{ 'is-active' if active == 'upload' }}">Hide a treasure</a>
    <a href="/hunts" class="{{ 'is-active' if active == 'hunts' }}">Hunts</a>
    <a href="/leaderboard" class="{{ 'is-active' if active == 'leaderboard' }}">Leaderboard</a>
    <a href="/shop" class="{{ 'is-active' if active == 'shop' }}">Shop</a>
    <a href="/login" class="{{ 'is-active' if active == 'account' }}">Account</a>
  </nav>
</header>
