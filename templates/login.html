<!DOCTYPE html>
<html lang="en">
<head>
  {% include "_head.html" %}
  <title>Log in · StepQuest</title>
</head>
<body>
  {% set active = "account" %}
  {% include "_topbar.html" %}

  <main class="card">
    <h1>Welcome, explorer</h1>
    <p id="who" class="muted">Checking who you are…</p>

    <!-- Shown when you are already logged in -->
    <div id="loggedIn" hidden>
      <p id="coins" class="muted coin-line"></p>
      <a id="toMap" class="btn" href="/">Go to the map</a>

      <form id="weightForm">
        <label for="weight">Your weight in kg <span class="muted">(used to estimate calories)</span></label>
        <input id="weight" name="weight_kg" inputmode="decimal" placeholder="for example 65">
        <button type="submit" class="btn btn--ghost">Save weight</button>
      </form>

      <button type="button" id="logout" class="btn btn--ghost">Log out</button>
    </div>

    <!-- Shown when you are logged out: one form at a time, so the page stays short -->
    <div id="forms" hidden>
      <form id="loginForm">
        <label for="loginUser">Username</label>
        <input id="loginUser" name="username" autocomplete="username" required>
        <label for="loginPass">Password</label>
        <input id="loginPass" name="password" type="password" autocomplete="current-password" required>
        <button type="submit" class="btn">Log in</button>
        <p class="switch">New here? <button type="button" class="link-button" data-show="registerForm">Create an account</button></p>
      </form>

      <form id="registerForm" hidden>
        <label for="regUser">Username <span class="muted">(3 to 50 letters, numbers or _)</span></label>
        <input id="regUser" name="username" autocomplete="username" required>
        <label for="regPass">Password <span class="muted">(at least 6 characters)</span></label>
        <input id="regPass" name="password" type="password" autocomplete="new-password" required>
        <button type="submit" class="btn">Create account</button>
        <p class="switch">Already have an account? <button type="button" class="link-button" data-show="loginForm">Log in</button></p>
      </form>
    </div>

    <p id="message" class="message" role="status"></p>
  </main>

  <script>
    // The browser only collects the details. Python checks them and keeps you logged in.
    const who = document.getElementById("who");
    const message = document.getElementById("message");
    const forms = document.getElementById("forms");
    const loggedIn = document.getElementById("loggedIn");
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");

    function show(text, ok) {
      message.textContent = text;
      message.className = "message " + (ok ? "ok" : "bad");
    }

    function showLoggedIn(user) {
      who.textContent = user
        ? `You are logged in as ${user.username}.`
        : "Log in to start hunting for treasure.";
      forms.hidden = Boolean(user);
      loggedIn.hidden = !user;
      if (user) { loadWeight(); loadCoins(); }
    }

    async function loadCoins() {
      const res = await fetch("/api/coins");
      if (!res.ok) return;
      const data = await res.json();
      document.getElementById("coins").textContent =
        `${data.balance} coins · ${data.found_treasure_ids.length} treasures found`;
    }

    // Your saved weight, shown in the weight box
    async function loadWeight() {
      const res = await fetch("/api/me/weight");
      if (!res.ok) return;
      const data = await res.json();
      document.getElementById("weight").value = data.weight_kg ?? "";
    }

    document.getElementById("weightForm").addEventListener("submit", async event => {
      event.preventDefault();
      try {
        const data = await send("/api/me/weight", Object.fromEntries(new FormData(event.target)));
        show(`Saved. Calories will use ${data.weight_kg} kg.`, true);
      } catch (error) {
        show(error.message, false);
      }
    });

    // "Create an account" / "Log in" links swap which form is visible
    document.querySelectorAll("[data-show]").forEach(button => {
      button.addEventListener("click", () => {
        const showRegister = button.dataset.show === "registerForm";
        registerForm.hidden = !showRegister;
        loginForm.hidden = showRegister;
        show("", true);
      });
    });

    // After logging in, go back to the page that sent us here (e.g. "/?drag").
    // Only follow paths on our own site, so a crafted link can't send users elsewhere.
    function goToNextPage() {
      const next = new URLSearchParams(location.search).get("next") || "/";
      const safe = next.startsWith("/") && !next.startsWith("//");
      location.href = safe ? next : "/";
    }

    async function send(url, body) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body || {})
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Something went wrong.");
      return data;
    }

    function handleForm(form, url, okText) {
      form.addEventListener("submit", async event => {
        event.preventDefault();
        try {
          await send(url, Object.fromEntries(new FormData(form)));
          form.reset();
          show(okText, true);
          goToNextPage();
        } catch (error) {
          show(error.message, false);
        }
      });
    }

    handleForm(loginForm, "/api/login", "Logged in. Taking you to the map…");
    handleForm(registerForm, "/api/register", "Account created. Taking you to the map…");

    document.getElementById("logout").addEventListener("click", async () => {
      await send("/api/logout");
      showLoggedIn(null);
      show("Logged out.", true);
    });

    fetch("/api/me").then(res => res.ok ? res.json() : null).then(showLoggedIn);
  </script>
</body>
</html>
